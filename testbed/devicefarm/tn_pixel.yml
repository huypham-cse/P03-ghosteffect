# Device Farm polish runs (b-log 19/11): TN3 phone ledger benchmark.
version: 0.1
android_test_host: amazon_linux_2023
phases:
  install:
    commands:
      - devicefarm-cli use java 17
      - devicefarm-cli use python 3.12
      - python3 --version
      - python3 -m pip install --target $HOME/radlib --no-index --find-links $DEVICEFARM_TEST_PACKAGE_PATH/wheelhouse radicale==3.9.0 || python3 -m pip install --target $HOME/radlib radicale==3.9.0
      - PYTHONPATH=$HOME/radlib python3 -m radicale --version
  pre_test:
    commands:
      - adb -s $DEVICEFARM_DEVICE_UDID wait-for-device
  test:
    commands:
      - bash $DEVICEFARM_TEST_PACKAGE_PATH/testbed/devicefarm/campaign_tn.sh ledger || true
  post_test:
    commands:
      - adb -s $DEVICEFARM_DEVICE_UDID reverse --remove-all || true
artifacts:
  - $DEVICEFARM_LOG_DIR
